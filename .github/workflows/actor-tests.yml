name: Server and Relay actor validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  actors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ACCESS_TOKEN || github.token }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100'
      - run: dotnet test ConnectX.Tests/ConnectX.Tests.csproj -c Release --nologo
